name: Build RedOS Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-redos/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-redos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-redos/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RedOS-Windows-Installer
          path: windows-redos/dist/*.exe
          if-no-files-found: error
          retention-days: 30
